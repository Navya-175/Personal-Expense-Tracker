<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <p class="eyebrow">PERSONAL FINANCE</p>
        <h1>Expense Tracker</h1>
        <p class="subtitle">Keep track of where your money goes.</p>
      </div>
      <span class="badge">Simple • Secure • Local</span>
    </header>

    <section class="summary-grid" aria-label="Expense summary">
      <article class="summary-card total-card">
        <p>Total expenses</p>
        <h2 id="totalAmount">₹0.00</h2>
      </article>
      <article class="summary-card">
        <p>This month</p>
        <h2 id="monthAmount">₹0.00</h2>
      </article>
      <article class="summary-card">
        <p>Transactions</p>
        <h2 id="transactionCount">0</h2>
      </article>
    </section>

    <section class="content-grid">
      <form id="expenseForm" class="panel">
        <h2>Add an expense</h2>
        <label for="title">Description</label>
        <input id="title" type="text" placeholder="e.g. Lunch" maxlength="60" required />
        <div class="form-row">
          <div>
            <label for="amount">Amount (₹)</label>
            <input id="amount" type="number" min="0.01" step="0.01" placeholder="250" required />
          </div>
          <div>
            <label for="category">Category</label>
            <select id="category">
              <option>Food</option><option>Travel</option><option>Shopping</option>
              <option>Bills</option><option>Health</option><option>Other</option>
            </select>
          </div>
        </div>
        <label for="date">Date</label>
        <input id="date" type="date" required />
        <button type="submit" class="primary-button">Add expense</button>
        <p id="formMessage" class="form-message" role="status"></p>
      </form>

      <section class="panel transactions-panel">
        <div class="list-heading">
          <h2>Recent transactions</h2>
          <select id="filterCategory" aria-label="Filter by category">
            <option value="All">All categories</option>
            <option>Food</option><option>Travel</option><option>Shopping</option>
            <option>Bills</option><option>Health</option><option>Other</option>
          </select>
        </div>
        <div id="expenseList" class="expense-list">
          <p class="empty-state">No expenses yet. Add your first expense.</p>
        </div>
      </section>
    </section>
    <footer>Expenses are stored in this browser using localStorage.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
